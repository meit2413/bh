<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 65" width="320" height="65" fill="none">
  <!-- Futuristic Glowing Hexagon Cloud Logo Icon -->
  <defs>
    <linearGradient id="beezer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC5C5C" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hex Node / Server Cloud Polygon -->
  <g filter="url(#glow)">
    <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" fill="url(#beezer-grad)" opacity="0.18" stroke="url(#beezer-grad)" stroke-width="2.5" />
    <path d="M23,24 L41,24 L45,32 L41,40 L23,40 L19,32 Z" fill="none" stroke="url(#beezer-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="4" fill="#FC5C5C" />
    <line x1="32" y1="8" x2="32" y2="20" stroke="#FC5C5C" stroke-width="2" stroke-dasharray="2,2"/>
    <line x1="32" y1="44" x2="32" y2="56" stroke="#FC5C5C" stroke-width="2" stroke-dasharray="2,2"/>
  </g>

  <!-- Brand Name Typography -->
  <text x="68" y="40" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">Beezer<tspan fill="#FC5C5C">host</tspan></text>
  <text x="69" y="52" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9.5" fill="#9CA3AF" letter-spacing="2">CLOUD INFRASTRUCTURE</text>
</svg>
